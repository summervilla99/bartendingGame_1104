<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#140a08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Bar Coda</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Josefin+Sans:wght@400;600&family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="-1" aria-label="Bar Coda 3D lounge"></canvas>
  <div id="bubbles"></div>

  <header class="top">
    <div class="brand"><span class="neon">Bar Coda</span><span class="brand-sub">LISTENING LOUNGE</span><div class="night" id="night-stat" hidden><span id="night-lb"></span><b id="night-prog"></b></div></div>
    <div class="top-r">
      <button class="stat roomchip" id="room-chip" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="rc-code"></span><span class="rc-n"></span><span class="rc-cta" data-i18n="inv_chip"></span></button>
      <div class="stat"><span data-i18n="tips"></span><b id="tips">₩0</b></div>
      <button class="ibtn" id="btn-settings" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-aria="settings_aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <div class="pop" id="settings" hidden>
    <div class="srow"><span data-i18n="set_lang"></span><button class="btn sm" id="btn-lang" type="button" data-i18n-aria="lang_aria"><span data-l="ko">KO</span>/<span data-l="en">EN</span></button></div>
    <div class="srow"><span data-i18n="set_night"></span><button class="btn sm" id="btn-night" type="button" data-i18n="night_btn"></button></div>
    <div class="srow"><span data-i18n="set_zoom"></span><input id="zoom-range" type="range" min="60" max="180" step="5" value="100" aria-label="zoom"></div>
    <div class="srow" id="row-genre"><span data-i18n="set_genre"></span><span class="segs" id="genre-seg"><button class="btn sm" type="button" data-g="jazz" data-i18n="mus_jazz"></button><button class="btn sm" type="button" data-g="house" data-i18n="mus_house"></button><button class="btn sm" type="button" data-g="classical" data-i18n="mus_classical"></button></span></div>
    <div class="srow" id="row-mood" hidden><span data-i18n="set_mood"></span><span class="segs" id="mood-seg"><button class="btn sm" type="button" data-t="golden" data-i18n="time_golden"></button><button class="btn sm" type="button" data-t="prime" data-i18n="time_prime"></button><button class="btn sm" type="button" data-t="last" data-i18n="time_last"></button></span></div>
    <div class="srow" id="row-limit" hidden><span data-i18n="set_limit"></span><span class="segs" id="limit-seg"><button class="btn sm" type="button" data-l="off" data-i18n="limit_off"></button><button class="btn sm" type="button" data-l="easy">60</button><button class="btn sm" type="button" data-l="mid">45</button><button class="btn sm" type="button" data-l="hard">30</button></span></div>
    <div class="srow" id="row-npc" hidden><span data-i18n="set_npc"></span><button class="btn sm" id="btn-npc" type="button" aria-pressed="true"></button></div>
    <div class="srow" id="row-room" hidden><span data-i18n="set_room"></span><span class="segs"><button class="btn sm" id="btn-room-invite" type="button" data-i18n="inv_settings"></button><button class="btn sm" id="btn-room-leave" type="button" data-i18n="room_leave"></button></span></div>
    <div class="srow"><span data-i18n="set_music"></span><button class="btn sm" id="btn-music" type="button" aria-pressed="false"><span class="ic" aria-hidden="true">♪</span><span class="lb" id="music-lb"></span></button></div>
  </div>

  <section id="ui-walk">
    <ul class="orders" id="orders" data-i18n-aria="orders_aria"></ul>
    <div class="joy" id="joy" aria-hidden="true"><i></i></div>
    <div class="dock">
      <button class="btn lg primary prompt" id="btn-act" type="button" hidden><kbd>E</kbd><span id="act-label"></span></button>
      <button class="btn sm" id="btn-order" type="button" data-i18n="order_btn" hidden></button>
      <button class="btn sm" id="btn-music-pick" type="button" data-i18n="music_pick" hidden></button>
      <button class="btn sm" id="btn-emote" type="button" data-i18n="emote_btn"></button>
      <button class="btn sm" id="btn-dance" type="button" data-i18n="emo_dance"></button>
      <button class="btn sm" id="btn-jump" type="button" data-i18n="emo_jump"></button>
      <button class="btn sm" id="btn-chat" type="button" data-i18n="chat_btn" hidden></button>
      <button class="btn sm" id="btn-chat-log" type="button" aria-expanded="false" hidden><span data-i18n="chat_log"></span><i class="cl-badge" id="chat-badge" hidden></i></button>
      <p class="hint" id="walk-hint" data-i18n-html="hint_kb"></p>
    </div>
  </section>

  <section id="ui-bar" hidden>
    <details class="ticket" id="ticket" open>
      <summary><span class="tk-no"><span id="tk-no">-</span><span class="tk-tag" id="tk-tag" data-i18n="tag_house" hidden></span></span><span class="tk-row"><b id="tk-name">-</b><span class="tk-method" id="tk-method"></span></span><span class="tk-toggle" aria-hidden="true"><span class="t-show" data-i18n="tk_show"></span><span class="t-hide" data-i18n="tk_hide"></span><i></i></span><span class="tk-live" id="tk-live" hidden></span></summary>
      <div class="tk-body">
        <p class="tk-why" id="tk-why"></p>
        <div class="tk-know" id="tk-know"></div>
        <p class="tk-meta" id="tk-meta"></p>
        <p class="tk-story" id="tk-story" hidden></p>
        <ul class="tk-lines" id="tk-lines"></ul>
        <p class="tk-extra" id="tk-extra" hidden></p>
      </div>
    </details>
    <button class="ibtn leave" id="btn-leave" type="button" data-i18n-aria="leave"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

    <div class="bar-bottom">
      <div class="bar-timer" id="bar-timer" hidden><span class="tl" data-i18n="timer_lb"></span><div class="tr"><i></i></div><span class="ts"></span></div>
      <ol class="steps" id="steps">
        <li data-step="pour" data-i18n="step_pour"></li><li data-step="mix" data-i18n="step_mix"></li><li data-step="garnish" data-i18n="step_garnish"></li><li data-step="serve" data-i18n="step_serve"></li>
      </ol>
      <div class="panel" id="panel-pour">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="chips" id="chips"></div>
        <div class="row">
          <button class="btn sm" id="btn-reset" type="button" data-i18n="reset"></button>
          <button class="btn primary" id="btn-next-pour" type="button" data-i18n="next_pour"></button>
        </div>
      </div>
      <div class="panel" id="panel-mix" hidden>
        <p class="say" id="mix-say"></p>
        <div class="mixmeter"><i id="mix-fill"></i></div>
        <div class="row"><button class="btn primary" id="btn-strain" type="button" data-i18n="strain"></button></div>
      </div>
      <div class="panel" id="panel-garnish" hidden>
        <p class="say" data-i18n="garnish_say"></p>
        <div class="chips" id="garnish-chips"></div>
        <div class="row"><button class="btn primary" id="btn-serve" type="button" data-i18n="serve"></button></div>
      </div>
    </div>
  </section>

  <div class="result" id="result" hidden>
    <div class="rcard" role="dialog" aria-labelledby="r-title">
      <p class="r-who" id="r-who"></p>
      <h2 id="r-title"></h2>
      <div class="stars" id="r-stars" role="img"></div>
      <p class="r-say" id="r-say"></p>
      <ul class="r-lines" id="r-lines"></ul>
      <div class="r-tip"><span data-i18n="tip"></span><b id="r-tip">₩0</b></div>
      <div class="row">
        <button class="btn sm" id="btn-r-leave" type="button" data-i18n="leave"></button>
        <button class="btn primary" id="btn-r-next" type="button" data-i18n="r_next"></button>
      </div>
    </div>
  </div>

  <div class="result" id="summary" hidden>
    <div class="rcard" role="dialog" aria-labelledby="sum-title">
      <p class="r-who" id="sum-when"></p>
      <h2 id="sum-title"></h2>
      <div class="stars" id="sum-stars" role="img"></div>
      <p class="r-say" id="sum-say"></p>
      <ul class="r-lines" id="sum-lines"></ul>
      <div class="r-tip"><span data-i18n="tip"></span><b id="sum-tip">₩0</b></div>
      <div class="row">
        <button class="btn sm" id="btn-sum-new" type="button" data-i18n="sum_new"></button>
        <button class="btn primary" id="btn-sum-next" type="button" data-i18n="sum_next" hidden></button>
        <button class="btn primary" id="btn-sum-again" type="button" data-i18n="sum_again"></button>
      </div>
    </div>
  </div>

  <div id="tale" hidden>
    <div class="tl-box">
      <span class="tl-who" id="tl-who" hidden></span>
      <p class="tl-text" id="tl-text"></p>
      <div class="tl-opts" id="tl-opts"></div>
      <span class="tl-next" id="tl-next" aria-hidden="true">▾</span>
    </div>
  </div>

  <div class="invite" id="invite" hidden role="dialog" aria-labelledby="inv-title">
    <div class="icard">
      <button class="inv-x" id="inv-close" type="button" data-i18n-aria="inv_close">×</button>
      <p class="inv-eyebrow" id="inv-title" data-i18n="inv_title"></p>
      <button class="inv-code" id="inv-code" type="button" aria-describedby="inv-hint"></button>
      <p class="inv-hint" id="inv-hint" data-i18n="inv_hint"></p>
      <input class="inv-link" id="inv-link" type="text" readonly aria-label="invite link">
      <div class="inv-row">
        <button class="btn primary" id="inv-copy" type="button" data-i18n="inv_copy"></button>
        <button class="btn" id="inv-share" type="button" data-i18n="inv_share" hidden></button>
      </div>
    </div>
  </div>

  <div id="start" hidden></div>

  <div class="emotes glass" id="emotes" hidden>
    <button class="btn sm" type="button" data-e="cheers" data-i18n="emo_cheers"></button>
    <button class="btn sm" type="button" data-e="wave" data-i18n="emo_wave"></button>
    <button class="btn sm" type="button" data-e="clap" data-i18n="emo_clap"></button>
    <button class="btn sm" type="button" data-e="bow" data-i18n="emo_bow"></button>
  </div>
  <div class="chatfeed" id="chatfeed" aria-live="polite"></div>
  <section class="chathist glass" id="chat-hist" hidden aria-labelledby="chat-hist-title">
    <header><b id="chat-hist-title" data-i18n="chat_hist_title"></b><span class="ch-n" id="chat-hist-n"></span><button type="button" class="ch-x" id="chat-hist-x" data-i18n-aria="chat_hist_close">×</button></header>
    <div class="ch-list" id="chat-hist-list" role="log" aria-live="polite"></div>
    <p class="ch-empty" id="chat-hist-empty" data-i18n="chat_hist_empty"></p>
  </section>
  <form class="chatbar glass" id="chat-form" hidden autocomplete="off">
    <input class="st-input" id="chat-input" maxlength="100" data-i18n-ph="chat_ph" autocomplete="off" enterkeyhint="send">
    <button class="btn primary sm" type="submit" data-i18n="chat_send"></button>
  </form>

  <div class="result" id="photo" hidden>
    <div class="rcard photocard" role="dialog">
      <img id="photo-img" alt="">
      <div class="row">
        <button class="btn sm" id="btn-photo-close" type="button" data-i18n="photo_close"></button>
        <button class="btn sm" id="btn-photo-share" type="button" data-i18n="photo_share" hidden></button>
        <button class="btn primary" id="btn-photo-save" type="button" data-i18n="photo_save"></button>
      </div>
    </div>
  </div>
  <div class="result" id="order-menu" hidden>
    <div class="rcard ordercard" role="dialog">
      <h2 data-i18n="order_title"></h2>
      <div class="order-list" id="order-list"></div>
      <div class="row"><button class="btn sm" id="order-close" type="button" data-i18n="photo_close"></button></div>
    </div>
  </div>
  <div class="result" id="music-menu" hidden>
    <div class="rcard ordercard" role="dialog">
      <h2 data-i18n="music_title"></h2>
      <div class="order-list" id="music-list">
        <button class="oc" type="button" data-g="jazz"><b data-i18n="mus_jazz"></b></button>
        <button class="oc" type="button" data-g="house"><b data-i18n="mus_house"></b></button>
        <button class="oc" type="button" data-g="classical"><b data-i18n="mus_classical"></b></button>
        <button class="oc" type="button" data-g="off"><b data-i18n="mus_off"></b></button>
      </div>
      <div class="row"><button class="btn sm" id="music-close" type="button" data-i18n="photo_close"></button></div>
    </div>
  </div>
  <div id="flash"></div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading" data-i18n="loading"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
